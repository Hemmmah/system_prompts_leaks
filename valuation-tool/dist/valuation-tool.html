<title>مُقيِّم الدخل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>

  }
}
:root[data-theme="dark"] {

}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 15px/1.6 var(--f-body); font-variant-numeric: tabular-nums; }
#app { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 1.3rem; font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 600; color: var(--muted); }
p { margin: 0; }
small, .hint { color: var(--muted); font-size: .8rem; }
.num, td.num, th.num { direction: ltr; text-align: right; unicode-bidi: plaintext; }
bdi { unicode-bidi: isolate; }

/* ---------- top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .eyebrow { font-size: .75rem; letter-spacing: .02em; color: var(--accent); font-weight: 600; }
.brand h1 { overflow-wrap: anywhere; }
.top .actions { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- KPI strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.kpi { background: var(--surface); padding: 8px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; cursor: pointer; border: 0; text-align: start; font: inherit; color: inherit; }
.kpi:hover { background: var(--surface-2); }
.kpi .k { font-size: .75rem; color: var(--muted); }
.kpi .v { font-size: 1.05rem; font-weight: 600; direction: ltr; text-align: right; }
.kpi .s { font-size: .72rem; color: var(--muted); direction: ltr; text-align: right; }
.kpi.final { background: var(--gold-soft); }
.kpi.final .v { color: var(--gold); font-size: 1.2rem; }
.kpi.alerts .v { color: var(--warn); }

/* ---------- steps nav */
.steps { display: flex; gap: 4px; overflow-x: auto; padding-block: 12px; scrollbar-width: thin; }
.steps button { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: .88rem; cursor: pointer; }
.steps button .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .72rem; font-weight: 700; }
.steps button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps button[aria-current="page"] .n { background: var(--accent-ink); color: var(--accent); }

/* ---------- panels */
.view { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.panel-head .tools { display: flex; flex-wrap: wrap; gap: 6px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.cols-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; align-items: start; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field .lbl { font-size: .82rem; color: var(--muted); }
.field.wide { grid-column: 1 / -1; }

input, select, textarea { font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
input.num { direction: ltr; text-align: right; }
textarea { min-height: 72px; resize: vertical; line-height: 1.6; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); padding: 0; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; cursor: pointer; }

.btn { font: inherit; font-size: .85rem; border-radius: 6px; padding: 6px 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 2px 8px; font-size: .78rem; }
.btn.danger { color: var(--bad); border-color: var(--line-strong); background: transparent; }

/* ---------- tables */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: middle; white-space: nowrap; }
thead th { background: var(--surface-2); font-weight: 600; color: var(--muted); font-size: .78rem; position: sticky; top: 0; }
tbody tr:last-child td { border-bottom: 0; }
tfoot td { background: var(--surface-2); font-weight: 600; border-top: 1px solid var(--line-strong); border-bottom: 0; }
table.grid td { padding: 3px 4px; }
table.grid input, table.grid select { padding: 4px 6px; font-size: .83rem; background: transparent; border-color: transparent; }
table.grid input:hover, table.grid select:hover { border-color: var(--line); }
table.grid input:focus, table.grid select:focus { background: var(--surface); border-color: var(--accent); }
table.grid .w-xs input { width: 4.2rem; } table.grid .w-s input, table.grid .w-s select { width: 6.5rem; }
table.grid .w-m input, table.grid .w-m select { width: 9rem; } table.grid .w-l input { width: 14rem; }
tr.row-out td { background: var(--warn-soft); }
tr.row-off td { opacity: .55; }
tr.row-bad td { background: var(--bad-soft); }
tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
tr.sub td { font-weight: 600; background: var(--surface-2); }
td.computed { color: var(--accent); font-weight: 500; }
.stmt td:first-child { white-space: normal; }
.stmt td.neg { color: var(--bad); }
.adjgrp { display: flex; gap: 2px; }
.adjgrp input { width: 3.4rem !important; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.muted { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.link { background: var(--accent-soft); color: var(--accent); }

.result { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 12px 16px; background: var(--accent-soft); border-radius: 8px; }
.result .big { font-family: var(--f-head); font-size: 1.6rem; font-weight: 700; color: var(--accent); direction: ltr; }
.result.gold { background: var(--gold-soft); }
.result.gold .big { color: var(--gold); }
.result .lab { font-size: .82rem; color: var(--muted); }
.trace { margin: 0; padding: 10px 14px; background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 8px; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: .84rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px; }

.stat .v { font-weight: 600; direction: ltr; text-align: right; }
.stat.hl { background: var(--accent-soft); border-color: var(--accent); }

.warnings { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }

.method { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.method.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.method .mv { font-size: 1.25rem; font-weight: 700; direction: ltr; text-align: right; color: var(--accent); }

.dots { position: relative; height: 54px; margin: 6px 12px 0; direction: ltr; }
.dots .axis { position: absolute; left: 0; right: 0; top: 24px; height: 2px; background: var(--line-strong); }
.dots .band { position: absolute; top: 16px; height: 18px; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 4px; opacity: .8; }
.dots .dot { position: absolute; top: 18px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.dots .dot.out { background: var(--warn); }
.dots .dot.off { background: var(--line-strong); }
.dots .mark { position: absolute; top: 8px; width: 2px; height: 34px; margin-left: -1px; background: var(--gold); }
.dots .mark span { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); font-size: .72rem; color: var(--gold); font-weight: 700; white-space: nowrap; }
.dots .tick { position: absolute; top: 34px; font-size: .7rem; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }

/* ---------- tornado */
.tornado { display: flex; flex-direction: column; gap: 4px; }
.trow { display: grid; grid-template-columns: minmax(110px, 180px) 1fr; gap: 10px; align-items: center; font-size: .82rem; }
.tbar { position: relative; height: 26px; direction: ltr; background: var(--surface-2); border-radius: 4px; }
.tbar .c { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .5; }
.tbar .seg { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; }
.tbar .seg.pos { background: var(--good); }
.tbar .seg.neg { background: var(--bad); }
.tbar .lbl { position: absolute; top: 3px; font-size: .72rem; font-weight: 600; white-space: nowrap; color: var(--ink); }
.heat td.num { font-weight: 500; }
.heat td.base { outline: 2px solid var(--gold); outline-offset: -2px; font-weight: 700; }

/* ---------- modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--radius); padding: 16px; width: min(760px, 100%); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
.modal textarea { min-height: 220px; direction: ltr; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline-start: 16px; background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; z-index: 30; font-size: .88rem; }

/* ---------- report */
.report { display: flex; flex-direction: column; gap: 14px; }
.report dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: .88rem; }
.report dt { color: var(--muted); }
.report dd { margin: 0; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 4px 20px; font-size: .88rem; margin: 0; padding: 0; list-style: none; }
.kv li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dotted var(--line); padding-block: 3px; }
.kv li b { font-weight: 600; direction: ltr; unicode-bidi: plaintext; }

@media (max-width: 640px) {
  .strip { position: static; grid-template-columns: repeat(2, 1fr); }
  .result .big { font-size: 1.3rem; }
}
@media print {
  .steps, .top .actions, .no-print, .rowact, .modal-bg { display: none !important; }
  .strip { position: static; box-shadow: none; }
  body { background: #fff; font-size: 12px; }
  .panel { break-inside: avoid; border-color: #ccc; }
  .scroll { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

      var mad = quantileSorted(dev, 0.5);
      if (mad > 0) {
        res.lower = st.median - km * mad / 0.6745; res.upper = st.median + km * mad / 0.6745;
        values.forEach(function (x, i) { if (isNum(x)) { scores[i] = 0.6745 * (x - st.median) / mad; flags[i] = Math.abs(scores[i]) > km; } });
      }
    } else {
      var ki = isNum(num(k)) ? num(k) : 1.5;
      res.lower = st.q1 - ki * st.iqr; res.upper = st.q3 + ki * st.iqr;
      values.forEach(function (x, i) {
        if (isNum(x)) { flags[i] = x < res.lower || x > res.upper; scores[i] = st.iqr > 0 ? (x - st.median) / st.iqr : 0; }
      });
    }
    return res;
  }

  /**
   * Generic evidence analysis used by rental comps, sales comps and cap-rate comps.
   * items: [{value, weight, include}]  (include=false => excluded by the appraiser)
   * opts: {pick: median|mean|trimmed|weighted|manual, manual, outlierMethod, outlierK,
   *        excludeOutliers: bool, range: iqr|minmax|sd}
   */
  function analyzeEvidence(items, opts) {
    opts = opts || {};
    var vals = items.map(function (it) { return it.valid && it.include ? it.value : NaN; });
    var ol = outliers(vals, opts.outlierMethod || 'iqr', opts.outlierK);
    var used = [], usedW = [];
    var rows = items.map(function (it, i) {
      var isOut = ol.flags[i];
      var use = it.valid && it.include && !(opts.excludeOutliers && isOut);
      if (use) { used.push(it.value); usedW.push(it.weight); }
      return Object.assign({}, it, { outlier: isOut, score: ol.scores[i], used: use });
    });
    var st = describe(used, usedW);
    var pick = opts.pick || 'median';
    var indicated = pick === 'manual' ? num(opts.manual) : st[pick];
    if (!isNum(indicated)) indicated = st.median;
    var rangeMode = opts.range || (st.n >= 4 ? 'iqr' : 'minmax');
    var low, high;
    if (rangeMode === 'iqr') { low = st.q1; high = st.q3; }
    else if (rangeMode === 'sd') { low = st.mean - st.sd; high = st.mean + st.sd; }
    else { low = st.min; high = st.max; }
    var warnings = [];
    if (st.n === 0) warnings.push('لا توجد مقارنات صالحة مستخدمة.');
    else if (st.n < 3) warnings.push('عدد المقارنات المستخدمة (' + st.n + ') أقل من 3؛ الدليل ضعيف.');
    if (st.n >= 3 && st.cv > 0.2) warnings.push('تشتت مرتفع بين المقارنات (معامل الاختلاف ' + (st.cv * 100).toFixed(1) + '%).');
    var nOut = rows.filter(function (r) { return r.outlier; }).length;
    if (nOut && !opts.excludeOutliers) warnings.push(nOut + ' قيمة شاذة مرصودة وما زالت ضمن الحساب — راجعها أو فعّل الاستبعاد التلقائي.');
    if (!ol.applicable && items.length) warnings.push('كشف القيم الشاذة الآلي يحتاج 5 مقارنات صالحة على الأقل؛ راجع القيم يدوياً.');
    return { rows: rows, stats: st, indicated: indicated, low: low, high: high, pick: pick, rangeMode: rangeMode, outlierBounds: [ol.lower, ol.upper], warnings: warnings };
  }

  // -------------------------------------------------------- comps normalise

  var ADJ_KEYS = ['time', 'location', 'size', 'condition', 'age', 'other'];

  function adjTotal(adj) {
    var t = 0;
    ADJ_KEYS.forEach(function (k) { var v = num(adj && adj[k]); if (isNum(v)) t += v; });
    return t;
  }

  function normKey(s) { return String(s || '').replace(/\s+/g, ' ').trim().toLowerCase(); }

  /** Rental comps -> annual rent per m², adjusted. */
  function normalizeRentComps(rows) {
    var seen = {};
    return (rows || []).map(function (r) {
      var rent = num(r.rent), area = num(r.area);
      var perYear = r.period === 'monthly' ? 12 : 1;
      var issues = [];
      var base = NaN;
      if (!isNum(rent) || rent <= 0) issues.push('الإيجار غير صالح');
      if (r.basis === 'perM2') base = rent * perYear;
      else {
        if (!isNum(area) || area <= 0) issues.push('المساحة مطلوبة');
        base = rent * perYear / area;
      }
      var adj = adjTotal(r.adj);
      var value = base * (1 + adj / 100);
      var key = normKey(r.label) + '|' + rent + '|' + area;
      var dup = !!seen[key]; seen[key] = true;
      if (dup) issues.push('مكرر محتمل');
      var valid = isNum(value) && value > 0 && issues.filter(function (x) { return x !== 'مكرر محتمل'; }).length === 0;
      return { label: r.label, category: (r.category || '').trim(), base: base, adjPct: adj, value: value, weight: numOr(r.weight, 1),
        include: r.include !== false, valid: valid, issues: issues, duplicate: dup };
    });
  }

  /** Sales comps -> price per m², adjusted. */
  function normalizeSaleComps(rows) {
    var seen = {};
    return (rows || []).map(function (r) {
      var price = num(r.price), area = num(r.area);
      var issues = [];
      var base = NaN;
      if (!isNum(price) || price <= 0) issues.push('السعر غير صالح');
      if (r.basis === 'perM2') base = price;
      else {
        if (!isNum(area) || area <= 0) issues.push('المساحة مطلوبة');
        base = price / area;
      }
      var adj = adjTotal(r.adj);
      var value = base * (1 + adj / 100);
      var key = normKey(r.label) + '|' + price + '|' + area;
      var dup = !!seen[key]; seen[key] = true;
      if (dup) issues.push('مكرر محتمل');
      var valid = isNum(value) && value > 0 && issues.filter(function (x) { return x !== 'مكرر محتمل'; }).length === 0;
      return { label: r.label, base: base, adjPct: adj, value: value, weight: numOr(r.weight, 1),
        include: r.include !== false, valid: valid, issues: issues, duplicate: dup };
    });
  }

  /** Cap-rate evidence: implied cap = NOI / price (or a stated cap), plus adjustment in % points. Value in %. */
  function normalizeCapComps(rows) {
    return (rows || []).map(function (r) {
      var price = num(r.price), noi = num(r.noi), stated = num(r.capRate);
      var issues = [];
      var base = NaN;
      if (isNum(price) && price > 0 && isNum(noi) && noi > 0) base = noi / price * 100;
      else if (isNum(stated) && stated > 0) base = stated;
      else issues.push('أدخل السعر وصافي الدخل أو معدل رسملة معلن');
      var adj = numOr(r.adjPts, 0);
      var value = base + adj;
      if (isNum(value) && (value < 2 || value > 20)) issues.push('معدل خارج النطاق المعتاد');
      var valid = isNum(value) && value > 0 && issues.indexOf('أدخل السعر وصافي الدخل أو معدل رسملة معلن') < 0;
      return { label: r.label, base: base, adjPct: adj, value: value, weight: numOr(r.weight, 1), include: r.include !== false, valid: valid, issues: issues };
    });
  }

  function evidenceOpts(cfg) {
    cfg = cfg || {};
    return { pick: cfg.pick, manual: cfg.manual, outlierMethod: cfg.outlierMethod, outlierK: cfg.outlierK,
      excludeOutliers: !!cfg.excludeOutliers, range: cfg.range === 'auto' ? undefined : cfg.range };
  }

  /** Market rent per m² per category ('' = all). */
  function analyzeRentComps(model) {
    var cfg = model.rentComps || {};
    var norm = normalizeRentComps(cfg.rows);
    var cats = {};
    norm.forEach(function (r) { cats[r.category || ''] = true; });
    var out = { all: analyzeEvidence(norm, evidenceOpts(cfg)), byCategory: {}, categories: Object.keys(cats).filter(Boolean) };
    out.categories.forEach(function (c) {
      var subset = norm.map(function (r) { return r.category === c ? r : Object.assign({}, r, { include: false }); });
      var a = analyzeEvidence(subset, evidenceOpts(cfg));
      a.rows = a.rows.filter(function (r) { return r.category === c; });
      out.byCategory[c] = a;
    });
    // Appraiser override per category
    var ov = cfg.overrides || {};
    out.rateFor = function (cat) {
      if (cat && isNum(num(ov[cat]))) return num(ov[cat]);
      if (cat && out.byCategory[cat] && out.byCategory[cat].stats.n) return out.byCategory[cat].indicated;
      return out.all.indicated;
    };
    return out;
  }

  // ------------------------------------------------------------------ shocks

  var SHOCKS = {
    rentPct: { label: 'الإيجارات', unit: '%', step: 5 },
    vacancyPts: { label: 'نسبة الشغور', unit: 'نقطة', step: 2 },
    opexPct: { label: 'المصروفات التشغيلية', unit: '%', step: 10 },
    capBps: { label: 'معدل الرسملة', unit: 'bps', step: 50 },
    discountBps: { label: 'معدل الخصم', unit: 'bps', step: 50 },
    exitCapBps: { label: 'معدل الرسملة التخارجي', unit: 'bps', step: 50 },
    growthPts: { label: 'نمو الإيجار', unit: 'نقطة', step: 1 },
    expenseGrowthPts: { label: 'نمو المصروفات', unit: 'نقطة', step: 1 },
    salePct: { label: 'سعر المتر في المقارنات البيعية', unit: '%', step: 5 }
  };

  function sh(model, k) { var s = model.__shocks; return s && isNum(s[k]) ? s[k] : 0; }

  function withShocks(model, shocks) {
    var m = Object.assign({}, model);
    var s = Object.assign({}, model.__shocks || {});
    Object.keys(shocks || {}).forEach(function (k) { var v = num(shocks[k]); if (isNum(v)) s[k] = (s[k] || 0) + v; });
    m.__shocks = s;
    return m;
  }

  // --------------------------------------------------------------- rent roll

  /** year (1-based) lets contract leases revert to market after u.leaseYears. */
  function computeRentRoll(model, rentAnalysis, year) {
    year = year || 1;
    var inc = model.income || {};
    var defBasis = inc.rentBasis || 'blended';
    var contractMult = inc.contractPeriod === 'monthly' ? 12 : 1;
    var rentShock = 1 + sh(model, 'rentPct') / 100;
    var rows = (inc.units || []).map(function (u) {
      var units = numOr(u.units, 1), area = num(u.area);
      var occ = clamp(numOr(u.occupied, units), 0, units);
      var rate = u.marketSource === 'comps' && rentAnalysis ? rentAnalysis.rateFor(u.category) : num(u.marketRate);
      var marketUnit = isNum(num(u.marketRentUnit)) && u.marketSource === 'unit' ? num(u.marketRentUnit) : rate * area;
      var contractUnit = num(u.contractRent) * contractMult;
      var leaseYears = num(u.leaseYears);
      var expired = isNum(leaseYears) && year > leaseYears;
      var hasContract = isNum(contractUnit) && contractUnit > 0 && !expired;
      var basis = u.basis && u.basis !== 'default' ? u.basis : defBasis;
      var pgi;
      if (basis === 'market') pgi = units * marketUnit;
      else if (basis === 'contract') pgi = units * (hasContract ? contractUnit : marketUnit);
      else pgi = occ * (hasContract ? contractUnit : marketUnit) + (units - occ) * marketUnit;
      var issues = [];
      if (!isNum(area) || area <= 0) issues.push('المساحة');
      if (!isNum(marketUnit)) issues.push('الإيجار السوقي');
      pgi = isNum(pgi) ? pgi * rentShock : 0;
      var marketTotal = isNum(marketUnit) ? units * marketUnit * rentShock : 0;
      var contractTotal = hasContract ? units * contractUnit * rentShock : NaN;
      return { label: u.label, category: u.category, units: units, area: area, totalArea: units * (isNum(area) ? area : 0), occupied: occ,
        marketRate: rate, marketUnit: marketUnit, contractUnit: contractUnit, basis: basis, pgi: pgi,
        marketTotal: marketTotal, contractTotal: contractTotal, expired: expired,
        reversionGap: hasContract && isNum(marketUnit) ? (marketUnit - contractUnit) / contractUnit : NaN, issues: issues };
    });
    var t = { pgi: 0, marketTotal: 0, contractTotal: 0, area: 0, units: 0, occupied: 0 };
    rows.forEach(function (r) {
      t.pgi += r.pgi; t.marketTotal += r.marketTotal; t.contractTotal += isNum(r.contractTotal) ? r.contractTotal : 0;
      t.area += r.totalArea; t.units += r.units; t.occupied += r.occupied;
    });
    t.physicalOccupancy = t.units ? t.occupied / t.units : NaN;
    return { rows: rows, totals: t };
  }

  // --------------------------------------------------------------------- NOI

  /**
   * factors: {revenue, expense, vacancyPct} for DCF years. Returns full statement + trace.
   */
  function computeNOI(model, rentAnalysis, factors) {
    factors = factors || {};
    var inc = model.income || {};
    var cs = model.case || {};
    var rev = isNum(factors.revenue) ? factors.revenue : 1;
    var exf = isNum(factors.expense) ? factors.expense : 1;
    var rr = computeRentRoll(model, rentAnalysis, factors.year);
    var pgi;
    if (inc.mode === 'direct') pgi = numOr(inc.pgiDirect, 0) * (1 + sh(model, 'rentPct') / 100);
    else pgi = rr.totals.pgi;
    pgi *= rev;
    var gla = numOr(cs.gla, rr.totals.area);
    var vac = isNum(factors.vacancyPct) ? factors.vacancyPct : pct(inc.vacancyPct, 0);
    vac = clamp(vac + sh(model, 'vacancyPts') / 100, 0, 1);
    var vacancyLoss = pgi * vac;
    var coll = pct(inc.collectionLossPct, 0);
    var collectionLoss = (pgi - vacancyLoss) * coll;
    var other = numOr(inc.otherIncome, 0) * rev;
    var egi = pgi - vacancyLoss - collectionLoss + other;
    var op = model.opex || {};
    var opShock = 1 + sh(model, 'opexPct') / 100;
    var lines = [];
    if (op.mode === 'ratio') {
      lines.push({ label: 'مصروفات تشغيلية (نسبة من الدخل الفعلي)', basis: 'pctEGI', input: op.ratio, amount: egi * pct(op.ratio, 0) * opShock });
    } else {
      (op.lines || []).forEach(function (l) {
        var a = num(l.amount), amt = 0;
        if (!isNum(a)) a = 0;
        if (l.basis === 'pctEGI') amt = egi * a / 100;
        else if (l.basis === 'pctPGI') amt = pgi * a / 100;
        else if (l.basis === 'perM2') amt = a * gla * exf;
        else amt = a * exf;
        lines.push({ label: l.label, basis: l.basis || 'fixed', input: l.amount, amount: amt * opShock });
      });
    }
    var opex = lines.reduce(function (s, l) { return s + l.amount; }, 0);
    var noi = egi - opex;
    return { rentRoll: rr, pgi: pgi, vacancyPct: vac, vacancyLoss: vacancyLoss, collectionPct: coll, collectionLoss: collectionLoss,
      otherIncome: other, egi: egi, opexLines: lines, opex: opex, opexRatio: egi ? opex / egi : NaN, noiComputed: noi, noi: noi, gla: gla };
  }

  /** Year-1 NOI with optional professional override (scaled under shocks so sensitivity still works). */
  function computeNOIFinal(model, rentAnalysis) {
    var r = computeNOI(model, rentAnalysis);
    var ov = (model.noiOverride || {});
    var trace = [];
    var fmt = function (x) { return fmtN(x); };
    r.overridden = false;
    if (ov.enabled && isNum(num(ov.value))) {
      var unshocked = model.__shocks ? computeNOI(Object.assign({}, model, { __shocks: null }), rentAnalysis).noiComputed : r.noiComputed;
      var ratio = unshocked ? r.noiComputed / unshocked : 1;
      r.noi = num(ov.value) * ratio;
      r.overrideFactor = r.noiComputed ? r.noi / r.noiComputed : 1;
      r.overridden = true;
    }
    trace.push('إجمالي الدخل المحتمل PGI = ' + fmt(r.pgi));
    trace.push('− خسارة الشغور (' + fmtP(r.vacancyPct) + ') = ' + fmt(r.vacancyLoss));
    trace.push('− خسارة التحصيل (' + fmtP(r.collectionPct) + ' من الدخل بعد الشغور) = ' + fmt(r.collectionLoss));
    trace.push('+ دخل آخر = ' + fmt(r.otherIncome));
    trace.push('= الدخل الفعلي الإجمالي EGI = ' + fmt(r.egi));
    trace.push('− المصروفات التشغيلية = ' + fmt(r.opex) + ' (' + fmtP(r.opexRatio) + ' من EGI)');
    trace.push('= صافي الدخل التشغيلي المحسوب NOI = ' + fmt(r.noiComputed));
    if (r.overridden) trace.push('↺ تجاوز مهني: NOI المعتمد = ' + fmt(r.noi) + (ov.note ? ' — المبرر: ' + ov.note : ''));
    r.trace = trace;
    r.warnings = [];
    if (r.pgi <= 0) r.warnings.push('إجمالي الدخل المحتمل صفر أو غير مكتمل — راجع جدول الوحدات.');
    if (isNum(r.opexRatio) && (r.opexRatio < 0.08 || r.opexRatio > 0.6)) r.warnings.push('نسبة المصروفات ' + fmtP(r.opexRatio) + ' خارج النطاق المعتاد (8%–60%).');
    if (r.noi <= 0) r.warnings.push('صافي الدخل التشغيلي سالب أو صفر.');
    if (r.overridden && !ov.note) r.warnings.push('تم تجاوز NOI دون تسجيل مبرر.');
    return r;
  }

  // ---------------------------------------------------------------- cap rate

  function mortgageConstant(ratePct, years, perYear) {
    var i = num(ratePct) / 100 / (perYear || 12), n = num(years) * (perYear || 12);
    if (!isNum(i) || !isNum(n) || n <= 0) return NaN;
    if (i === 0) return 1 / num(years);
    return (i / (1 - Math.pow(1 + i, -n))) * (perYear || 12);
  }

  function computeCapRate(model) {
    var c = model.cap || {};
    var methods = {};
    var comps = analyzeEvidence(normalizeCapComps(c.rows), evidenceOpts(c));
    methods.comps = { label: 'مقارنات السوق (المعدل الضمني)', value: comps.indicated, low: comps.low, high: comps.high, detail: comps };

    var b = c.band || {};
    var ltv = pct(b.ltv), mc = mortgageConstant(b.rate, b.years, 12), edr = pct(b.equityRate);
    var bandCap = ltv * mc + (1 - ltv) * edr;
    methods.band = { label: 'النطاق الاستثماري Band of Investment', value: bandCap * 100, mc: mc, ltv: ltv, edr: edr };

    var bu = c.buildup || {};
    var y = numOr(bu.riskFree, NaN);
    (bu.premiums || []).forEach(function (p) { var v = num(p.value); if (isNum(v)) y += v; });
    var g = numOr(bu.growth, 0);
    methods.buildup = { label: 'البناء التراكمي (معدل الخصم − النمو)', value: y - g, discount: y, growth: g };

    methods.survey = { label: 'تقارير/مسوح السوق', value: num((c.survey || {}).value), low: num((c.survey || {}).low), high: num((c.survey || {}).high), source: (c.survey || {}).source };

    var sel = c.selection || 'comps';
    var selected, basisText;
    if (sel === 'weighted') {
      var w = c.weights || {}, tw = 0, acc = 0;
      ['comps', 'band', 'buildup', 'survey'].forEach(function (k) {
        var wk = numOr(w[k], 0);
        if (wk > 0 && isNum(methods[k].value)) { tw += wk; acc += wk * methods[k].value; }
      });
      selected = tw ? acc / tw : NaN;
      basisText = 'متوسط مرجح للطرق حسب الأوزان المحددة';
    } else if (sel === 'manual') {
      selected = num(c.manual);
      basisText = 'معدل محدد مهنياً';
    } else {
      selected = methods[sel] ? methods[sel].value : NaN;
      basisText = methods[sel] ? methods[sel].label : '';
    }
    var bpsShock = sh(model, 'capBps') / 100;
    var baseSelected = selected;
    selected = selected + bpsShock;

    var low, high;
    var spread = numOr(c.rangeBps, 50) / 100;
    if (c.rangeMode === 'evidence' && sel === 'comps' && isNum(comps.low)) { low = comps.low + bpsShock; high = comps.high + bpsShock; }
    else if (c.rangeMode === 'manual' && isNum(num(c.rangeLow)) && isNum(num(c.rangeHigh))) { low = num(c.rangeLow) + bpsShock; high = num(c.rangeHigh) + bpsShock; }
    else { low = selected - spread; high = selected + spread; }

    var warnings = comps.warnings.map(function (w) { return 'معدل الرسملة: ' + w; });
    if (!isNum(selected) || selected <= 0) warnings.push('معدل الرسملة المختار غير صالح.');
    if (sel === 'manual' && !c.note) warnings.push('معدل الرسملة محدد يدوياً دون مبرر مسجل.');
    var vals = ['comps', 'band', 'buildup', 'survey'].map(function (k) { return methods[k].value; }).filter(isNum);
    if (vals.length >= 2) {
      var spreadAll = Math.max.apply(null, vals) - Math.min.apply(null, vals);
      if (spreadAll > 1.5) warnings.push('فجوة ' + spreadAll.toFixed(2) + ' نقطة مئوية بين طرق اشتقاق معدل الرسملة — وضّح سبب الترجيح.');
    }
    return { methods: methods, selection: sel, selected: selected, baseSelected: baseSelected, low: low, high: high, basisText: basisText, warnings: warnings };
  }

  // ------------------------------------------------------ direct capitalisation

  function computeDirectCap(model, noiRes, capRes) {
    var d = model.direct || {};
    var cs = model.case || {};
    var cap = capRes.selected / 100;
    var adjustments = (d.adjustments || []).map(function (a) { return { label: a.label, amount: numOr(a.amount, 0) }; });
    var adjSum = adjustments.reduce(function (s, a) { return s + a.amount; }, 0);
    var raw = noiRes.noi / cap;
    var value = raw + adjSum;
    var low = noiRes.noi / (capRes.high / 100) + adjSum;
    var high = noiRes.noi / (capRes.low / 100) + adjSum;
    var rounding = cs.rounding;
    var trace = [
      'القيمة = NOI ÷ معدل الرسملة = ' + fmtN(noiRes.noi) + ' ÷ ' + fmtP(cap) + ' = ' + fmtN(raw),
      adjSum ? 'تعديلات بعد الرسملة (مصروفات رأسمالية/تأجير/أراضٍ زائدة) = ' + fmtN(adjSum) : 'لا توجد تعديلات بعد الرسملة',
      'القيمة قبل التقريب = ' + fmtN(value) + ' ← بعد التقريب = ' + fmtN(roundTo(value, rounding)),
      'النطاق عند معدل ' + fmtP(capRes.high / 100) + ' – ' + fmtP(capRes.low / 100) + ': ' + fmtN(roundTo(low, rounding)) + ' – ' + fmtN(roundTo(high, rounding))
    ];
    return { raw: raw, adjustments: adjustments, adjSum: adjSum, value: value, rounded: roundTo(value, rounding),
      low: low, high: high, perM2: noiRes.gla ? value / noiRes.gla : NaN, multiplier: noiRes.egi ? value / noiRes.egi : NaN, trace: trace,
      valid: isNum(value) && cap > 0 };
  }

  // --------------------------------------------------------------------- DCF

  function computeDCF(model, rentAnalysis, noiRes, capRes, opts) {
    opts = opts || {};
    var d = model.dcf || {};
    var cs = model.case || {};

      { h: 'التاريخ', cls: 'w-s', f: function (r, i, p) { return inp(p + '.date', { ph: '2026-06' }); } },
      { h: 'تعديلات % (زمن، موقع، مساحة، حالة، عمر، أخرى)', f: function (r, i, p) { return adjCells(p); } },
      { h: 'الوزن', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.weight', { num: 1 }); } },
      { h: 'ر.س/م²/سنة', num: 1, cls: 'computed', f: function (r, i) { return N(all[i] && all[i].base); } },
      { h: 'التعديل', num: 1, f: function (r, i) { return all[i] ? Pc(all[i].adjPct, 1) : ''; } },
      { h: 'بعد التعديل', num: 1, cls: 'computed', f: function (r, i) { return N(all[i] && all[i].value); } },
      { h: 'الحالة', f: function (r, i) { return evidenceStatus(catRow(ra, i) || all[i]); } }
    ];
    var cats = ra.categories.length ? ra.categories : [''];
    var cards = cats.map(function (c) {
      var a = c ? ra.byCategory[c] : ra.all;
      var ov = c ? '<div class="form">' + field('معدل معتمد مهنياً لهذه الفئة (اختياري)', inp('rentComps.overrides.' + c, { num: 1, ph: 'فارغ = المستخلص' })) + '</div>' : '';
      var applied = ra.rateFor(c);
      return '<div class="method"><div class="panel-head"><h2>' + (c ? 'فئة: ' + esc(c) : 'جميع المقارنات') + '</h2>' +
        '<span class="mv">' + N(applied) + ' <small>' + cur() + '/م²</small></span></div>' +
        dotPlot(a.rows, a.indicated, a.low, a.high, function (v) { return N(v); }) + statsBlock(a, function (v) { return N(v); }, cur() + '/م²') + ov +
        warnList(a.warnings) + '</div>';
    }).join('');
    return '<section class="panel"><div class="panel-head"><h2>المقارنات الإيجارية</h2><div class="tools">' +
      btn('addRow', 'إضافة مقارن', 'data-list="rentComps.rows" data-tpl="rentComp"', 'ghost') + pasteButton('rentComps.rows', 'rent') + btn('copyTable', 'نسخ الجدول', 'data-table="t-rent"', 'ghost') + '</div></div>' +
      '<p class="hint">تقبل الحقول الأرقام العربية والفواصل والعملة. الإيجار الشهري يُحوّل إلى سنوي، والإجمالي يُقسم على المساحة. التعديلات نسب مئوية موجبة أو سالبة على المقارن ليعادل العقار محل التقييم.</p>' +
      editTable('rentComps.rows', cols, { id: 't-rent', rowClass: function (r, i) { return rowClassFor(catRow(ra, i) || all[i]); } }) +
      evidenceControls('rentComps') + '</section>' +
      '<section class="panel"><div class="panel-head"><h2>الإيجار السوقي المستخلص لكل فئة</h2></div>' +
      '<p class="hint">جدول الوحدات في «الدخل وNOI» يستخدم هذه المعدلات تلقائياً عندما يكون مصدر الإيجار «من المقارنات» وتطابق الفئة.</p>' +
      '<div class="cols">' + cards + '</div></section>';
  }
  function catRow(ra, i) {
    var r = ra.all.rows[i];
    if (!r || !r.category || !ra.byCategory[r.category]) return null;
    var list = ra.byCategory[r.category].rows, idx = 0;
    for (var k = 0; k < i; k++) if (ra.all.rows[k].category === r.category) idx++;
    return list[idx];
  }

      { h: 'المؤجر', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.occupied', { num: 1 }); } },

      { h: 'السوقي ر.س/م²', cls: 'w-s', f: function (r, i, p) { return r.marketSource === 'comps' ? '<span class="chip link">' + N(rr.rows[i] && rr.rows[i].marketRate) + '</span>' : inp(p + '.marketRate', { num: 1 }); } },
      { h: 'أساس الدخل', cls: 'w-s', f: function (r, i, p) { return sel(p + '.basis', [['default', 'الافتراضي'], ['blended', 'تعاقدي للمؤجر + سوقي للشاغر'], ['contract', 'تعاقدي'], ['market', 'سوقي']]); } },

    ];
    var foot = '<tfoot><tr><td>الإجمالي</td><td></td><td class="num">' + N(rr.totals.units) + '</td><td class="num">' + N(rr.totals.area) + ' م²</td><td class="num">' + N(rr.totals.occupied) +
      '</td><td colspan="7">الإشغال الفعلي ' + P(rr.totals.physicalOccupancy, 1) + ' · الإيجار السوقي الكامل ' + N(rr.totals.marketTotal) + ' · التعاقدي ' + N(rr.totals.contractTotal) + '</td><td class="num">' + N(rr.totals.pgi) + '</td><td></td></tr></tfoot>';

    var opCols = [
      { h: 'البند', cls: 'w-l', f: function (r, i, p) { return inp(p + '.label'); } },
      { h: 'أساس الاحتساب', cls: 'w-m', f: function (r, i, p) { return sel(p + '.basis', [['fixed', 'مبلغ سنوي ثابت'], ['perM2', 'ريال لكل م² GLA'], ['pctEGI', '% من الدخل الفعلي EGI'], ['pctPGI', '% من الدخل المحتمل PGI']]); } },
      { h: 'القيمة المدخلة', cls: 'w-s', f: function (r, i, p) { return inp(p + '.amount', { num: 1 }); } },
      { h: 'المبلغ السنوي', num: 1, cls: 'computed', f: function (r, i) { return N(n.opexLines[i] && n.opexLines[i].amount); } },

    ].concat(n.opexLines.map(function (l) { return ['  ' + (l.label || 'مصروف'), -l.amount]; })).concat([

    ]);

    stmt.push(['صافي الدخل التشغيلي المعتمد NOI', n.noi, 'total']);

    return '<section class="panel"><div class="panel-head"><h2>مصدر الدخل</h2></div><div class="form">' +
      field('طريقة احتساب الدخل المحتمل', sel('income.mode', [['rentroll', 'جدول الوحدات (موصى به)'], ['direct', 'إدخال PGI مباشرة']])) +

        field('أساس الدخل الافتراضي', sel('income.rentBasis', [['blended', 'تعاقدي للمؤجر + سوقي للشاغر'], ['market', 'سوقي بالكامل'], ['contract', 'تعاقدي بالكامل']]), 'للرسملة المباشرة على أساس السوق اختر «سوقي بالكامل»') +
        field('الإيجار التعاقدي مدخل', sel('income.contractPeriod', [['annual', 'سنوياً للوحدة'], ['monthly', 'شهرياً للوحدة']]))) +
      '</div>' + (direct ? '' : '<div class="panel-head"><h3>جدول الوحدات Rent Roll</h3><div class="tools">' + btn('addRow', 'إضافة صف', 'data-list="income.units" data-tpl="unit"', 'ghost') + '</div></div>' +

      field('نسبة الشغور والفاقد %', inp('income.vacancyPct', { num: 1 }), 'من إجمالي الدخل المحتمل') +
      field('خسارة التحصيل %', inp('income.collectionLossPct', { num: 1 }), 'من الدخل بعد الشغور') +

      '<div class="panel-head"><h2>المصروفات التشغيلية</h2></div><div class="form">' +

      (m.opex.mode === 'ratio' ? '' : editTable('opex.lines', opCols, { id: 't-opex' }) + '<div>' + btn('addRow', 'إضافة بند', 'data-list="opex.lines" data-tpl="opexLine"', 'ghost') + '</div>') +
      '</section>' +
      '<section class="panel"><div class="panel-head"><h2>قائمة صافي الدخل التشغيلي</h2><div class="tools">' + btn('copyTable', 'نسخ', 'data-table="t-stmt"', 'ghost') + '</div></div>' +
      '<div class="scroll"><table class="stmt" id="t-stmt"><thead><tr><th>البند</th><th class="num">سنوي (' + esc(cur()) + ')</th><th class="num">ر.س/م²</th></tr></thead><tbody>' +
      stmt.map(function (s) { return '<tr class="' + (s[2] || '') + '"><td>' + esc(s[0]) + '</td><td class="num ' + (s[1] < 0 ? 'neg' : '') + '">' + N(s[1]) + '</td><td class="num">' + N(s[1] / n.gla, 1) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' + traceList(n.trace) +
      '<div class="panel-head"><h3>تجاوز مهني لصافي الدخل</h3></div>' +
      '<div class="form">' + '<div class="field"><span class="lbl">التفعيل</span>' + chk('noiOverride.enabled', 'اعتماد NOI مختلف عن المحسوب') + '</div>' +
      (m.noiOverride.enabled ? field('NOI المعتمد', inp('noiOverride.value', { num: 1 })) + field('المبرر', inp('noiOverride.note', { ph: 'مثال: حسب القوائم المدققة 2025' }), '', 'wide') : '') + '</div>' +
      warnList(n.warnings) + '</section></div>';
  }

  // -------------------------------------------------------------- tab: cap
  function tabCap(R) {
    var c = R.cap, m = state.model, a = c.methods.comps.detail;
    var cols = [
      { h: 'مستخدم', f: function (r, i, p) { return '<input type="checkbox" data-path="' + p + '.include"' + (r.include !== false ? ' checked' : '') + ' aria-label="استخدام">'; } },
      { h: 'الصفقة', cls: 'w-l', f: function (r, i, p) { return inp(p + '.label'); } },
      { h: 'سعر البيع', cls: 'w-s', f: function (r, i, p) { return inp(p + '.price', { num: 1 }); } },
      { h: 'صافي الدخل NOI', cls: 'w-s', f: function (r, i, p) { return inp(p + '.noi', { num: 1 }); } },
      { h: 'أو معدل معلن %', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.capRate', { num: 1 }); } },
      { h: 'التاريخ', cls: 'w-s', f: function (r, i, p) { return inp(p + '.date'); } },
      { h: 'تعديل (نقطة %)', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.adjPts', { num: 1 }); } },
      { h: 'الوزن', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.weight', { num: 1 }); } },
      { h: 'المعدل الضمني', num: 1, cls: 'computed', f: function (r, i) { return a.rows[i] ? Pc(a.rows[i].base) : ''; } },
      { h: 'بعد التعديل', num: 1, cls: 'computed', f: function (r, i) { return a.rows[i] ? Pc(a.rows[i].value) : ''; } },
      { h: 'الحالة', f: function (r, i) { return evidenceStatus(a.rows[i]); } }
    ];
    var band = c.methods.band, bu = c.methods.buildup, sv = c.methods.survey;
    var sel0 = m.cap.selection;
    var on = function (k) { return sel0 === k || (sel0 === 'weighted' && E.numOr(m.cap.weights[k], 0) > 0) ? ' on' : ''; };
    var pf = function (v) { return isNum(v) ? v.toFixed(2) + '%' : '—'; };

    var methodVals = ['comps', 'band', 'buildup', 'survey'].map(function (k) { return { label: c.methods[k].label, value: c.methods[k].value, valid: isNum(c.methods[k].value), used: true }; });

    return '<section class="panel"><div class="panel-head"><h2>أدلة معدل الرسملة من الصفقات</h2><div class="tools">' +
      btn('addRow', 'إضافة صفقة', 'data-list="cap.rows" data-tpl="capComp"', 'ghost') + pasteButton('cap.rows', 'cap') + btn('copyTable', 'نسخ', 'data-table="t-cap"', 'ghost') + '</div></div>' +
      '<p class="hint">المعدل الضمني = NOI ÷ سعر البيع. عند عدم توفر NOI أدخل المعدل المعلن للصفقة. «التعديل» بالنقاط المئوية لفروق الموقع/الجودة/المخاطر (موجب = مخاطر أعلى في العقار محل التقييم).</p>' +
      editTable('cap.rows', cols, { id: 't-cap', rowClass: function (r, i) { return rowClassFor(a.rows[i]); } }) +
      evidenceControls('cap') + dotPlot(a.rows, a.indicated, a.low, a.high, pf) + statsBlock(a, pf, '%') + warnList(a.warnings) + '</section>' +

      '<section class="panel"><div class="panel-head"><h2>طرق اشتقاق بديلة</h2></div><div class="cols-3">' +
      '<div class="method' + on('comps') + '"><h3>مقارنات السوق</h3><span class="mv">' + pf(c.methods.comps.value) + '</span><small>من ' + a.stats.n + ' صفقات مستخدمة · النطاق ' + pf(a.low) + ' – ' + pf(a.high) + '</small></div>' +
      '<div class="method' + on('band') + '"><h3>النطاق الاستثماري Band of Investment</h3><div class="form">' +
      field('نسبة التمويل LTV %', inp('cap.band.ltv', { num: 1 })) + field('معدل الفائدة %', inp('cap.band.rate', { num: 1 })) +
      field('مدة القرض (سنوات)', inp('cap.band.years', { num: 1 })) + field('عائد حقوق الملكية %', inp('cap.band.equityRate', { num: 1 })) + '</div>' +
      '<small>ثابت الرهن السنوي ' + P(band.mc) + ' · ' + P(band.ltv, 0) + ' × ' + P(band.mc) + ' + ' + P(1 - band.ltv, 0) + ' × ' + P(band.edr) + '</small><span class="mv">' + pf(band.value) + '</span></div>' +
      '<div class="method' + on('buildup') + '"><h3>البناء التراكمي</h3><div class="form">' + field('العائد الخالي من المخاطر %', inp('cap.buildup.riskFree', { num: 1 })) + '</div>' +
      editTable('cap.buildup.premiums', [
        { h: 'العلاوة', cls: 'w-m', f: function (r, i, p) { return inp(p + '.label'); } },
        { h: '%', cls: 'w-xs', f: function (r, i, p) { return inp(p + '.value', { num: 1 }); } }]) +
      '<div>' + btn('addRow', 'إضافة علاوة', 'data-list="cap.buildup.premiums" data-tpl="premium"', 'ghost sm') + '</div>' +
      '<div class="form">' + field('النمو طويل الأجل g %', inp('cap.buildup.growth', { num: 1 })) + '</div>' +
      '<small>معدل الخصم ' + pf(bu.discount) + ' − النمو ' + pf(bu.growth) + '</small><span class="mv">' + pf(bu.value) + '</span>' +
      '<div>' + btn('useDiscount', 'استخدم ' + pf(bu.discount) + ' كمعدل خصم في DCF', '', 'ghost sm') + '</div></div>' +
      '<div class="method' + on('survey') + '"><h3>تقارير ومسوح السوق</h3><div class="form">' +
      field('المعدل %', inp('cap.survey.value', { num: 1 })) + field('الأدنى %', inp('cap.survey.low', { num: 1 })) + field('الأعلى %', inp('cap.survey.high', { num: 1 })) +
